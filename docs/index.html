<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="data:,">
  <title>VGM MIDI DJ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>VGM·DJ</h1>
      <div class="header-spacer"></div>
      <button class="toggle" id="test-mode-toggle" role="switch" aria-checked="false">
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
        <span>preview</span>
      </button>
      <div id="midi-status"><span class="dot" id="midi-dot"></span><span id="midi-port">no midi</span></div>
    </header>

    <section id="browser">
      <div class="browser-controls">
        <div class="input-wrap">
          <input type="text" id="browser-search" placeholder="search…" autocomplete="off">
          <button class="input-clear" id="browser-clear" hidden aria-label="clear">×</button>
        </div>
        <span id="browser-count" class="muted">…</span>
      </div>
      <div class="browser-games" id="browser-games"></div>
      <div id="browser-list"></div>
    </section>

    <section id="decks">
      <div class="deck" id="deck-a" data-deck="a">
        <div class="deck-head">
          <span class="deck-label">A</span>
          <span class="track-name muted">— empty —</span>
        </div>
        <div class="deck-stats">
          <span><b class="stat-bpm">—</b><i>bpm</i></span>
          <span><b class="stat-key">—</b><i>key</i></span>
          <span><b class="stat-duration">—</b><i>len</i></span>
          <span><b class="stat-position">0:00</b><i>pos</i></span>
          <span><b class="stat-meter">—</b><i>meter</i></span>
        </div>
        <canvas class="piano-roll" data-deck="a"></canvas>
        <div class="deck-controls">
          <button class="btn btn-play" data-deck="a">▶</button>
          <button class="btn btn-drop" data-deck="a" title="launch at next bar of other deck">drop</button>
          <button class="btn btn-cue" data-deck="a">cue</button>
          <div class="loop-group" data-deck="a">
            <button class="btn-loop-pad" data-deck="a" data-beats="1" title="1 beat loop">1</button>
            <button class="btn-loop-pad" data-deck="a" data-beats="2" title="2 beat loop">2</button>
            <button class="btn-loop-pad" data-deck="a" data-beats="4" title="4 beat loop">4</button>
            <button class="btn-loop-pad" data-deck="a" data-beats="8" title="8 beat loop">8</button>
            <button class="btn-loop-pad" data-deck="a" data-beats="16" title="16 beat loop">16</button>
          </div>
          <div class="transpose" data-deck="a">
            <button class="transpose-btn" data-deck="a" data-delta="-1" title="−1 semitone">−</button>
            <span class="transpose-value" title="transpose (drums skip)">0</span>
            <button class="transpose-btn" data-deck="a" data-delta="1" title="+1 semitone">+</button>
          </div>
          <div class="cslider vol-slider" data-target="vol-a" data-min="0" data-max="127" data-value="100"></div>
        </div>
        <div class="routing-slots" data-deck="a"></div>
      </div>

      <div id="mix-switch">
        <button class="mix-pos" data-state="a">A</button>
        <button class="mix-pos active" data-state="both">A+B</button>
        <button class="mix-pos" data-state="b">B</button>
      </div>

      <div class="deck" id="deck-b" data-deck="b">
        <div class="deck-head">
          <span class="deck-label">B</span>
          <span class="track-name muted">— empty —</span>
        </div>
        <div class="deck-stats">
          <span><b class="stat-bpm">—</b><i>bpm</i></span>
          <span><b class="stat-key">—</b><i>key</i></span>
          <span><b class="stat-duration">—</b><i>len</i></span>
          <span><b class="stat-position">0:00</b><i>pos</i></span>
          <span><b class="stat-meter">—</b><i>meter</i></span>
        </div>
        <canvas class="piano-roll" data-deck="b"></canvas>
        <div class="deck-controls">
          <button class="btn btn-play" data-deck="b">▶</button>
          <button class="btn btn-drop" data-deck="b" title="launch at next bar of other deck">drop</button>
          <button class="btn btn-cue" data-deck="b">cue</button>
          <div class="loop-group" data-deck="b">
            <button class="btn-loop-pad" data-deck="b" data-beats="1" title="1 beat loop">1</button>
            <button class="btn-loop-pad" data-deck="b" data-beats="2" title="2 beat loop">2</button>
            <button class="btn-loop-pad" data-deck="b" data-beats="4" title="4 beat loop">4</button>
            <button class="btn-loop-pad" data-deck="b" data-beats="8" title="8 beat loop">8</button>
            <button class="btn-loop-pad" data-deck="b" data-beats="16" title="16 beat loop">16</button>
          </div>
          <div class="transpose" data-deck="b">
            <button class="transpose-btn" data-deck="b" data-delta="-1" title="−1 semitone">−</button>
            <span class="transpose-value" title="transpose (drums skip)">0</span>
            <button class="transpose-btn" data-deck="b" data-delta="1" title="+1 semitone">+</button>
          </div>
          <div class="cslider vol-slider" data-target="vol-b" data-min="0" data-max="127" data-value="100"></div>
        </div>
        <div class="routing-slots" data-deck="b"></div>
      </div>
    </section>

    <footer>
      <button id="btn-stop-all">stop</button>
      <div class="master-transport">
        <div class="master-beat" id="master-beat"></div>
        <button id="master-tap" title="tap tempo">tap</button>
        <button id="master-reset" title="reset to beat 1">↻</button>
        <span id="master-bpm-value">120</span><i>bpm</i>
        <div id="master-meter-mount"></div>
      </div>
      <div class="master-bpm">
        <div class="cslider" data-target="bpm" data-min="20" data-max="220" data-value="120"></div>
      </div>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/webaudio-tinysynth@1.1.3/webaudio-tinysynth.js"></script>
  <script src="app.js"></script>
</body>
</html>
