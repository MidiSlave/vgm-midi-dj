<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="data:,">
  <title>VGM MIDI DJ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>VGM·DJ</h1>
      <div class="header-spacer"></div>
      <a class="prev-link" href="previewer.html" style="color:#aaa;text-decoration:none;font-size:12px;padding:4px 10px;border:1px solid #2a2a2a;border-radius:4px;margin-right:8px;">previewer →</a>
      <button class="toggle" id="test-mode-toggle" role="switch" aria-checked="false">
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
        <span>preview</span>
      </button>
      <div id="midi-status"><span class="dot" id="midi-dot"></span><span id="midi-port">no midi</span></div>
    </header>

    <section id="browser">
      <div class="browser-controls">
        <div class="input-wrap">
          <input type="text" id="browser-search" placeholder="search…" autocomplete="off">
          <button class="input-clear" id="browser-clear" hidden aria-label="clear">×</button>
        </div>
        <span id="browser-count" class="muted">…</span>
      </div>
      <div class="browser-games" id="browser-games"></div>
      <div id="browser-list"></div>
    </section>

    <section id="decks">
      <div class="deck" id="deck-1" data-deck="1">
        <div class="deck-head">
          <span class="deck-label">1</span>
          <span class="track-name muted">— empty —</span>
          <button class="btn btn-channel" data-deck="1" data-channel="a" title="reassign deck to channel A or B">A</button>
          <button class="btn btn-auto" data-deck="1" title="when track ends, play next in browser order">auto ↻</button>
          <button class="btn btn-unmute-all" data-deck="1" title="unmute all outputs on this deck">unmute all</button>
        </div>
        <div class="deck-stats">
          <span><b class="stat-bpm">—</b><i>bpm</i></span>
          <span><b class="stat-key">—</b><i>key</i></span>
          <span><b class="stat-duration">—</b><i>len</i></span>
          <span><b class="stat-position">0:00</b><i>pos</i></span>
          <span><b class="stat-meter">—</b><i>meter</i></span>
        </div>
        <div class="deck-roll-row">
          <canvas class="piano-roll" data-deck="1"></canvas>
          <div class="cslider vol-slider" data-target="vol-1" data-orientation="vertical" data-min="0" data-max="127" data-value="100" title="deck 1 volume"></div>
        </div>
        <div class="deck-controls">
          <button class="btn btn-play" data-deck="1">▶</button>
          <button class="btn btn-drop" data-deck="1" title="launch at next bar of master">drop</button>
          <button class="btn btn-trans" data-deck="1" title="transition: drop the other deck with inverse mute at next bar">trans</button>
          <button class="btn btn-cut" data-deck="1" title="stop this deck at the next master bar">cut</button>
          <button class="btn btn-cue" data-deck="1">cue</button>
          <div class="loop-group" data-deck="1">
            <button class="btn btn-loop-toggle" data-deck="1" title="engage loop / arm exit">loop</button>
            <div class="loop-length-mount" data-deck="1"></div>
          </div>
          <div class="transpose" data-deck="1">
            <button class="transpose-btn" data-deck="1" data-delta="-1" title="−1 semitone">−</button>
            <span class="transpose-value" title="transpose (drums skip)">0</span>
            <button class="transpose-btn" data-deck="1" data-delta="1" title="+1 semitone">+</button>
          </div>
        </div>
        <div class="routing-slots" data-deck="1"></div>
      </div>

      <div id="mix-switch">
        <button class="mix-pos" data-state="a">A</button>
        <button class="mix-pos active" data-state="both">A+B</button>
        <button class="mix-pos" data-state="b">B</button>
      </div>

      <div class="deck" id="deck-2" data-deck="2">
        <div class="deck-head">
          <span class="deck-label">2</span>
          <span class="track-name muted">— empty —</span>
          <button class="btn btn-channel" data-deck="2" data-channel="b" title="reassign deck to channel A or B">B</button>
          <button class="btn btn-auto" data-deck="2" title="when track ends, play next in browser order">auto ↻</button>
          <button class="btn btn-unmute-all" data-deck="2" title="unmute all outputs on this deck">unmute all</button>
        </div>
        <div class="deck-stats">
          <span><b class="stat-bpm">—</b><i>bpm</i></span>
          <span><b class="stat-key">—</b><i>key</i></span>
          <span><b class="stat-duration">—</b><i>len</i></span>
          <span><b class="stat-position">0:00</b><i>pos</i></span>
          <span><b class="stat-meter">—</b><i>meter</i></span>
        </div>
        <div class="deck-roll-row">
          <canvas class="piano-roll" data-deck="2"></canvas>
          <div class="cslider vol-slider" data-target="vol-2" data-orientation="vertical" data-min="0" data-max="127" data-value="100" title="deck 2 volume"></div>
        </div>
        <div class="deck-controls">
          <button class="btn btn-play" data-deck="2">▶</button>
          <button class="btn btn-drop" data-deck="2" title="launch at next bar of master">drop</button>
          <button class="btn btn-trans" data-deck="2" title="transition: drop the other deck with inverse mute at next bar">trans</button>
          <button class="btn btn-cut" data-deck="2" title="stop this deck at the next master bar">cut</button>
          <button class="btn btn-cue" data-deck="2">cue</button>
          <div class="loop-group" data-deck="2">
            <button class="btn btn-loop-toggle" data-deck="2" title="engage loop / arm exit">loop</button>
            <div class="loop-length-mount" data-deck="2"></div>
          </div>
          <div class="transpose" data-deck="2">
            <button class="transpose-btn" data-deck="2" data-delta="-1" title="−1 semitone">−</button>
            <span class="transpose-value" title="transpose (drums skip)">0</span>
            <button class="transpose-btn" data-deck="2" data-delta="1" title="+1 semitone">+</button>
          </div>
        </div>
        <div class="routing-slots" data-deck="2"></div>
      </div>
    </section>

    <footer>
      <div class="footer-left">
        <button id="btn-stop-all">stop</button>
        <div class="master-controls">
          <button id="master-tap" title="tap tempo">tap</button>
          <button id="master-reset" title="reset to beat 1">↻</button>
          <span id="master-bpm-value">120</span><i>bpm</i>
          <div id="master-meter-mount"></div>
        </div>
      </div>
      <div class="master-beat" id="master-beat"></div>
      <div class="master-bpm">
        <div class="cslider" data-target="bpm" data-min="20" data-max="220" data-value="120"></div>
      </div>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/webaudio-tinysynth@1.1.3/webaudio-tinysynth.js"></script>
  <script src="app.js"></script>
</body>
</html>
